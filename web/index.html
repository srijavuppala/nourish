<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced at build time by the --base-href argument. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Nourish — keep your eating honest in 20 seconds a day</title>
  <meta name="description" content="Most food trackers ask you to weigh every ingredient. Nourish learns your usual meals once, then daily logging is a few swipes.">
  <link rel="canonical" href="https://nourishhealth.app/">

  <!-- Matches the app's green, so the browser chrome does not flash blue. -->
  <meta name="theme-color" content="#2E7D57" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101511" media="(prefers-color-scheme: dark)">

  <!-- Installed web app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nourish">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Link previews in Slack, WhatsApp, iMessage and the like. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nourish">
  <meta property="og:title" content="Nourish">
  <meta property="og:description" content="Tell us how you eat once. Then keep it honest in 20 seconds a day.">
  <meta property="og:url" content="https://nourishhealth.app/">
  <meta property="og:image" content="https://nourishhealth.app/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nourish — tell us how you eat once, then keep it honest in 20 seconds a day.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nourish">
  <meta name="twitter:description" content="Tell us how you eat once. Then keep it honest in 20 seconds a day.">
  <meta name="twitter:image" content="https://nourishhealth.app/social-preview.png">

  <style>
    :root {
      --bg: #F4F9F5;
      --ink: #2E7D57;
      --muted: #5B6B60;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101511;
        --ink: #7FD1A6;
        --muted: #9AA79F;
      }
    }

    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }

    /* The compiled app is a few megabytes, so without this the first visit is
       several seconds of blank white. Flutter removes it on its first frame. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
      z-index: 2;
    }
    #boot.done { opacity: 0; pointer-events: none; }

    #boot svg { width: 68px; height: 68px; animation: breathe 2.4s ease-in-out infinite; }
    #boot .name { color: var(--ink); font-size: 27px; font-weight: 700; letter-spacing: -.4px; }
    #boot .line { color: var(--muted); font-size: 15px; max-width: 280px; text-align: center; line-height: 1.45; }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: .92; }
      50%      { transform: scale(1.06); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot svg { animation: none; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M16 84 Q20 26 86 14 Q80 74 16 84 Z" fill="currentColor" style="color: var(--ink)"/>
      <path d="M16 84 L86 14" stroke="var(--bg)" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <div class="name">Nourish</div>
    <div class="line">Tell us how you eat once.<br>Then keep it honest in 20 seconds a day.</div>
  </div>

  <script>
    // Flutter fires this once it has painted, which is the honest moment to
    // hand the screen over.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
