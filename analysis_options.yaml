include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # The earlier web prototype keeps its own (much denser) style.
    - legacy/**
    - build/**
    # firebase-tools ships Dart templates inside node_modules.
    - functions/**
    - web/**

linter:
  rules:
    - prefer_single_quotes
    - avoid_print
    - require_trailing_commas
